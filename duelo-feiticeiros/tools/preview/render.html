<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Duelo dos Feiticeiros — prévia</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Arial Black","Arial",sans-serif}
  canvas{display:block}
  #view{position:absolute;inset:0}
  #tintI,#tintW{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;opacity:0}
  .bar{position:absolute;left:0;right:0;height:12%;background:#000;z-index:5}
  #sub{position:absolute;left:10%;right:10%;top:91.5%;height:5%;font:bold 26px Arial;color:#fff;text-align:center;z-index:6;white-space:nowrap}
  #tech{position:absolute;left:0;right:0;top:40%;text-align:center;font:900 96px "Arial Black",Arial;color:#fff;z-index:7;letter-spacing:2px}
  #techSub{position:absolute;left:0;right:0;top:58%;text-align:center;font:900 26px Arial;z-index:7}
  #flash,#fade{position:absolute;inset:0;z-index:8;pointer-events:none}
  #fade{background:#000;z-index:9}
  #lines{position:absolute;inset:0;z-index:4;pointer-events:none}
  #endT{position:absolute;left:0;right:0;top:35%;text-align:center;font:900 80px "Arial Black",Arial;color:#fff;z-index:10}
  #endS{position:absolute;left:0;right:0;top:50%;text-align:center;font:bold 30px Arial;color:#c8c8d7;z-index:10}
  #endB{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:240px;height:52px;border-radius:12px;background:#961e32;color:#fff;font:bold 20px Arial;display:flex;align-items:center;justify-content:center;z-index:10}
  #skip{position:absolute;right:20px;top:2.5%;width:120px;height:34px;background:rgba(30,30,40,.7);color:#fff;font:bold 16px Arial;display:flex;align-items:center;justify-content:center;z-index:10}
  #tag{position:absolute;left:10px;top:10px;font:12px Arial;color:#fff;opacity:.8;background:rgba(0,0,0,.5);padding:3px 7px;border-radius:5px;z-index:11}
</style>
</head>
<body>
<div id="view"></div>
<div id="tintW"></div><div id="tintI"></div>
<svg id="lines" viewBox="-640 -360 1280 720" preserveAspectRatio="none"></svg>
<div class="bar" id="barT" style="top:0"></div><div class="bar" id="barB" style="bottom:0"></div>
<div id="sub"></div>
<div id="tech"></div><div id="techSub"></div>
<div id="flash"></div><div id="fade"></div>
<div id="endT"></div><div id="endS"></div><div id="endB" style="display:none">▶ Assistir de novo</div>
<div id="skip">Pular ▸</div>
<div id="tag">Prévia aproximada fora do Roblox (sem partículas) — geometria e roteiro reais</div>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.getElementById('view').appendChild(renderer.domElement);
const sc = new THREE.Scene();
sc.background = null;
const camera = new THREE.PerspectiveCamera(50, W / H, 0.3, 4000);
// céu noturno (gradiente) + névoa azulada
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#05061a') }, bot: { value: new THREE.Color('#2a1d4a') } },
  vertexShader: 'varying vec3 v; void main(){ v = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 v; void main(){ float k = smoothstep(-0.05, 0.5, v.y); gl_FragColor = vec4(mix(bot, top, k), 1.); }' }));
sc.add(sky);
sc.fog = new THREE.FogExp2(0x1a1838, 0.0021);
sc.add(new THREE.HemisphereLight(0x6070c0, 0x151018, 0.9));
const moon = new THREE.DirectionalLight(0xb8c8ff, 1.3); moon.position.set(-180, 330, -700); sc.add(moon);
const fill = new THREE.DirectionalLight(0x8060a0, 0.35); fill.position.set(200, 80, 300); sc.add(fill);

const GEO = { Block: new THREE.BoxGeometry(1, 1, 1), Ball: new THREE.SphereGeometry(0.5, 20, 14), Cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 24).rotateZ(Math.PI / 2) };
const ROUGH = { Concrete: .9, Slate: .9, Asphalt: .95, Metal: .35, WoodPlanks: .85, Fabric: .95, SmoothPlastic: .5 };
const matCache = new Map();
function material(p) {
  const key = p.c.join(',') + p.m + p.t;
  if (matCache.has(key)) return matCache.get(key);
  const color = new THREE.Color(`rgb(${p.c[0]},${p.c[1]},${p.c[2]})`);
  const o = { color, roughness: ROUGH[p.m] ?? .6, metalness: p.m === 'Metal' ? .7 : 0 };
  if (p.m === 'Neon') { o.emissive = color; o.emissiveIntensity = 1.5; }
  if (p.m === 'ForceField') { o.transparent = true; o.opacity = .4; o.emissive = color; o.emissiveIntensity = 1.2; o.depthWrite = false; }
  if (p.m === 'Glass') { o.transparent = true; o.opacity = .5; }
  if (p.t > 0) { o.transparent = true; o.opacity = Math.min(o.opacity ?? 1, 1 - p.t); o.depthWrite = false; }
  const m = new THREE.MeshStandardMaterial(o); matCache.set(key, m); return m;
}
function matrixOf(p) {
  let s = p.z; if (p.s === 'Ball') { const m = Math.min(...s); s = [m, m, m]; }
  const r = p.r;
  return new THREE.Matrix4().set(r[0], r[1], r[2], p.p[0], r[3], r[4], r[5], p.p[1], r[6], r[7], r[8], p.p[2], 0, 0, 0, 1).multiply(new THREE.Matrix4().makeScale(s[0], s[1], s[2]));
}
// cidade: junta as peças por material numa geometria só (poucas chamadas de desenho)
const city = await (await fetch('data/city.json')).json();
const groups = new Map();
for (const p of city) { const k = (p.s in GEO ? p.s : 'Block') + '|' + p.c.join(',') + p.m + p.t; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); }
for (const [k, list] of groups) {
  const base = GEO[k.split('|')[0]].toNonIndexed();
  const bp = base.attributes.position.array, bn = base.attributes.normal.array;
  const pos = new Float32Array(bp.length * list.length), nor = new Float32Array(bn.length * list.length);
  const v = new THREE.Vector3(), nm = new THREE.Matrix3();
  list.forEach((p, j) => {
    const m = matrixOf(p); nm.getNormalMatrix(m);
    for (let i = 0; i < bp.length; i += 3) {
      v.set(bp[i], bp[i + 1], bp[i + 2]).applyMatrix4(m); pos.set([v.x, v.y, v.z], j * bp.length + i);
      v.set(bn[i], bn[i + 1], bn[i + 2]).applyMatrix3(nm).normalize(); nor.set([v.x, v.y, v.z], j * bn.length + i);
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  sc.add(new THREE.Mesh(g, material(list[0])));
}
// luzes perto da arena (janelas/neon em volta): algumas luzes pontuais para dar cor ao telhado
for (const [c, x, z] of [[0xff4690, 90, 30], [0x46dcff, -90, -30], [0xffd27a, 20, -80]]) { const L = new THREE.PointLight(c, 300, 160, 1.6); L.position.set(x, 75, z); sc.add(L); }

const frames = await (await fetch('data/frames.json')).json();
const dyn = new THREE.Group(); sc.add(dyn);
const lights = [];
for (let i = 0; i < 6; i++) { const L = new THREE.PointLight(0xffffff, 0, 60, 1.5); sc.add(L); lights.push(L); }

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(sc, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.5, 0.4, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// linhas de velocidade (28 raios, como na interface do jogo)
const svg = document.getElementById('lines');
for (let k = 1; k <= 28; k++) {
  const a = k / 28 * Math.PI * 2, w = 2 + (k % 3) * 2, op = 1 - (0.35 + (k % 4) * 0.12);
  svg.insertAdjacentHTML('beforeend', `<line x1="0" y1="0" x2="${Math.cos(a) * 960}" y2="${Math.sin(a) * 960}" stroke-width="${w}" stroke-opacity="${op}" />`);
}
const $ = id => document.getElementById(id);
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

window.FRAMES = frames.length;
window.showFrame = (i) => {
  const f = frames[i];
  dyn.clear();
  let li = 0;
  for (const p of f.parts) {
    const mesh = new THREE.Mesh(GEO[p.s] || GEO.Block, material(p));
    mesh.matrixAutoUpdate = false; mesh.matrix.copy(matrixOf(p)); dyn.add(mesh);
    // efeitos neon grandes iluminam o entorno
    if (p.m === 'Neon' && p.t < 0.6 && Math.max(...p.z) > 3 && li < lights.length && !(p.c[0] < 90 && p.c[1] < 90 && p.c[2] < 90)) {
      const L = lights[li++]; L.color.setRGB(p.c[0] / 255, p.c[1] / 255, p.c[2] / 255); L.intensity = 400 * (1 - p.t); L.position.set(...p.p);
    }
  }
  for (; li < lights.length; li++) lights[li].intensity = 0;
  camera.position.set(...f.cam); camera.up.set(...f.up); camera.fov = f.fov; camera.updateProjectionMatrix(); camera.lookAt(...f.look);
  sky.position.copy(camera.position);
  // ColorCorrection (aproximação com filtros CSS)
  let filt = '';
  const tW = f.tone, tI = f.impact;
  const view = $('view');
  if (tW && (tW.sat !== 0 || tW.con !== 0)) filt += `saturate(${Math.max(0, 1 + tW.sat)}) contrast(${1 + tW.con}) `;
  $('tintW').style.opacity = tW && (tW.sat !== 0 || tW.con !== 0) ? 1 : 0; if (tW) $('tintW').style.background = rgb(tW.tint);
  const imp = tI && tI.sat <= -0.5;
  if (imp) filt += `grayscale(1) contrast(${1 + tI.con * 1.6}) brightness(${1 + tI.bri * 1.5}) `;
  $('tintI').style.opacity = imp ? 1 : 0; if (tI) $('tintI').style.background = rgb(tI.tint);
  view.style.filter = filt || 'none';
  // interface
  const u = f.ui || {};
  $('barT').style.display = $('barB').style.display = $('skip').style.display = u.bars ? 'block' : 'none';
  if (u.bars) $('skip').style.display = 'flex';
  $('fade').style.opacity = 1 - (u.fade ?? 1);
  $('flash').style.background = rgb(u.flashC || [255, 255, 255]); $('flash').style.opacity = 1 - (u.flash ?? 1);
  $('sub').innerHTML = (u.sub || '').replace(/<font color="#([0-9A-Fa-f]{6})">/g, '<span style="color:#$1">').replace(/<\/font>/g, '</span>');
  $('sub').style.opacity = 1 - (u.subT ?? 1);
  $('tech').textContent = u.tech || ''; $('tech').style.opacity = 1 - (u.techT ?? 1);
  const tc = rgb(u.techC || [255, 255, 255]);
  $('tech').style.textShadow = `-5px -5px 0 ${tc},5px -5px 0 ${tc},-5px 5px 0 ${tc},5px 5px 0 ${tc},0 0 30px ${tc}`;
  $('techSub').textContent = u.techSub || ''; $('techSub').style.color = tc; $('techSub').style.opacity = 1 - (u.techT ?? 1);
  svg.style.display = u.lines ? 'block' : 'none'; svg.style.stroke = rgb(u.linesC || [255, 255, 255]);
  $('endT').textContent = u.end || ''; $('endS').textContent = u.end ? u.endSub : ''; $('endB').style.display = u.end ? 'flex' : 'none';
  composer.render();
  return true;
};
window.READY = true;
</script>
</body>
</html>
