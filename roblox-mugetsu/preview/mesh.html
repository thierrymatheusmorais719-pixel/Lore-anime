<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malha do Mugetsu</title>
<style>html,body{margin:0;height:100%;background:#26282e;color:#ddd;font:13px system-ui}canvas{display:block;width:100%;height:100%}#l{position:absolute;top:8px;left:8px;background:#000a;padding:4px 8px;border-radius:5px}</style></head>
<body><div id="l">MugetsuMesh.obj — ?seg=1 (cores de depuração) | ?view=0..3 | ?zoom=0.85</div><canvas id="c"></canvas>
<script type="module">
// Mostra os pedaços exportados por tools/import_mesh.py, com as cores do MeshKitManifest (ou de depuração).
import * as THREE from "../../vendor/three/build/three.module.js";
const q = new URLSearchParams(location.search), view = +(q.get("view") || 0), seg = q.has("seg");
const manifest = await (await fetch("../src/shared/MeshKitManifest.json")).json();
const txt = await (await fetch("../" + manifest.file)).text();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x26282e);
const V = []; let cur = null; const groups = {};
for (const line of txt.split("\n")) {
  const t = line.trim().split(/\s+/);
  if (t[0] === "o") { cur = t[1]; groups[cur] = []; }
  else if (t[0] === "v") V.push(t.slice(1, 4).map(Number));
  else if (t[0] === "f") groups[cur].push(...t.slice(1, 4).map((s) => parseInt(s) - 1));
}
const DEBUG = [0xe6194b, 0x3cb44b, 0xffe119, 0x4363d8, 0xf58231, 0x911eb4, 0x46f0f0, 0xf032e6, 0xbcf60c, 0xfabebe, 0x008080, 0xe6beff, 0x9a6324, 0xfffac8, 0x800000];
let i = 0; const box = new THREE.Box3();
for (const [name, idx] of Object.entries(groups)) {
  if (name === manifest.rootName || (q.get("only") && q.get("only") !== name)) continue;
  const pos = []; for (const k of idx) pos.push(...V[k]);
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  const c = manifest.pieces[name]?.color || [200, 200, 200];
  const mat = new THREE.MeshStandardMaterial({ color: seg ? DEBUG[i++ % DEBUG.length] : new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255), roughness: 0.75, flatShading: true, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, mat); scene.add(mesh); box.expandByObject(mesh);
}
for (const e of manifest.extras) { const m = new THREE.Mesh(new THREE.BoxGeometry(...e.size), new THREE.MeshBasicMaterial({ color: new THREE.Color(e.color[0] / 255, e.color[1] / 255, e.color[2] / 255) })); m.position.set(...e.worldPos); scene.add(m); }
scene.add(new THREE.HemisphereLight(0xebebf0, 0x46464c, 1.3)); const sun = new THREE.DirectionalLight(0xfffaf0, 2.4); sun.position.set(-30, 60, -50); scene.add(sun);
const canvas = document.getElementById("c"), r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight, false);
const cam = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 200), a = [Math.PI, Math.PI / 2, 0, -Math.PI / 2][view];
const ctr = box.getCenter(new THREE.Vector3()), h = box.max.y - box.min.y, zoom = q.get("zoom");
const look = zoom ? new THREE.Vector3(ctr.x, box.min.y + h * +zoom, ctr.z) : ctr, d = zoom ? h * 0.7 : h * 1.75;
cam.position.set(look.x + Math.sin(a) * d, look.y + h * 0.05, look.z + Math.cos(a) * d); cam.lookAt(look); r.render(scene, cam); window.__ready = true;
</script></body></html>
