<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBJ original</title>
<style>html,body{margin:0;height:100%;background:#26282e;color:#ddd;font:13px system-ui}canvas{display:block;width:100%;height:100%}#l{position:absolute;top:8px;left:8px;background:#000a;padding:4px 8px;border-radius:5px}</style></head>
<body><div id="l">OBJ original (sem conversão) — ?m=ichigo|mugetsu&amp;view=0..3</div><canvas id="c"></canvas>
<script type="module">
// Visualizador mínimo dos OBJ enviados (cor por vértice), para comparar com a conversão em Parts.
// Mesmo mapeamento de eixos do tools/import_obj.py: (x, y, z) do OBJ -> (x, z, y).
import * as THREE from "../../vendor/three/build/three.module.js";
const q = new URLSearchParams(location.search), name = q.get("m") || "ichigo", view = +(q.get("view") || 0);
const txt = await (await fetch(`../assets/models/${name}.obj`)).text();
const V = [], C = [], pos = [], col = [];
for (const line of txt.split("\n")) {
  const t = line.trim().split(/\s+/);
  if (t[0] === "v") { const n = t.slice(1).map(Number); V.push([n[0], n[2], n[1]]); C.push(n.length >= 6 ? n.slice(3, 6) : [0.8, 0.8, 0.8]); }
  else if (t[0] === "f") { const ids = t.slice(1).map((s) => parseInt(s) - 1); for (let i = 1; i + 1 < ids.length; i++) for (const k of [ids[0], ids[i + 1], ids[i]]) { pos.push(...V[k]); col.push(...C[k]); } }
}
const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x26282e);
scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.7, side: THREE.DoubleSide, flatShading: true })));
scene.add(new THREE.HemisphereLight(0xebebf0, 0x46464c, 1.3)); const sun = new THREE.DirectionalLight(0xfffaf0, 2.4); sun.position.set(-30, 60, -50); scene.add(sun);
const canvas = document.getElementById("c"), r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight, false);
const cam = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100); const a = [Math.PI, Math.PI / 2, 0, -Math.PI / 2][view];
cam.position.set(Math.sin(a) * 8.6, 3.0, Math.cos(a) * 8.6); cam.lookAt(0.2, 2.5, 0); r.render(scene, cam); window.__ready = true;
</script></body></html>
