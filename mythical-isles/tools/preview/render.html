    fragmentShader: `uniform sampler2D grad; uniform float D, yTop, yBot; varying vec3 p;
      void main(){ float e = asin(clamp(p.y,-1.,1.)); float y = D*tan(clamp(e,-1.4,1.4)); float f = clamp((yTop - y)/(yTop - yBot), 0., 1.);
      vec4 c = texture2D(grad, vec2(.5, 1.-f)); gl_FragColor = vec4(pow(c.rgb, vec3(2.2)), 1.); }` });
  sky.position.copy(camera.position);
  const T = S.theme;
  if (sc.fog) sc.fog.color = new THREE.Color(rgbs(T.fog));
  const camP = camera.position.clone();
  const off = (az, el, d) => { const a = az * Math.PI / 180, e = el * Math.PI / 180; return new THREE.Vector3(Math.cos(a) * Math.cos(e) * d, Math.sin(e) * d, Math.sin(a) * Math.cos(e) * d).add(camP); };
  const sprite = (cv, pos, w, h) => { const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, transparent: true, fog: false, depthWrite: false, toneMapped: false }));
    sp.position.copy(pos); sp.scale.set(w, h, 1); sc.add(sp); return sp; };
  const circ = (g, x, y, r, c, a) => { g.globalAlpha = a ?? 1; g.fillStyle = rgbs(c); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1; };
  const rrect = (g, x, y, w, h, c, a) => { g.globalAlpha = a ?? 1; g.fillStyle = rgbs(c); g.beginPath(); g.roundRect(x, y, w, h, h / 2); g.fill(); g.globalAlpha = 1; };
  for (const s of S.stars) { const cv = document.createElement('canvas'); cv.width = cv.height = 16; circ(cv.getContext('2d'), 8, 8, 7, [255, 255, 255], .85); sprite(cv, off(s[0], s[1], 1500), s[2], s[2]); }
  for (const s of S.streaks) { const cv = document.createElement('canvas'); cv.width = 512; cv.height = Math.max(8, Math.round(512 * s[4] / s[3]));
    rrect(cv.getContext('2d'), 0, 0, cv.width, cv.height, T.streak, .85); sprite(cv, off(s[0], s[1], s[2]), s[3], s[4]); }
  for (const c of S.clouds) {
    const W = 512, H = Math.round(512 * c.h / c.w); const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
    rrect(g, W * 0.09, H * (c.base + 0.08) - H * 0.26, W * 0.82, H * 0.26, T.shade);
    const col = { shade: T.shade, fill: T.cloud, hi: T.hi };
    for (const layer of ['shade', 'fill', 'hi']) for (const p of c.puffs) if (p[3] === layer) circ(g, p[0] * W, p[1] * H, p[2] * H, col[layer]);
    sprite(cv, off(c.az, c.elev, c.dist), c.w, c.h);
  }
  { const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d');
    circ(g, 128, 128, 128, T.glow, .28); circ(g, 128, 128, 87, T.glow, .55); circ(g, 128, 128, 56, T.sun);
    if (T.moon) circ(g, 146, 113, 44, [Math.round((T.top[0] * .7 + T.mid[0] * .3)), Math.round((T.top[1] * .7 + T.mid[1] * .3)), Math.round((T.top[2] * .7 + T.mid[2] * .3))]);
    const sd = q.get('sun') ? q.get('sun').split(',').map(Number) : [60, 30];
    sprite(cv, off(sd[0], sd[1], 1450), 240, 240); }
}
// nuvens de tempestade (BillboardGui escuras do jogo) — aproximadas como sprites
if (q.get('storm')) {
  const storms = await (await fetch('data/storm_sky.json')).json();
  for (const [x, y, z, w, kind] of storms) {
    const W = 512, H = 230; const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
    const c = (cx, cy, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill(); };
    const cols = kind === 'storm' ? ['rgb(62,66,96)', 'rgb(104,110,146)', 'rgb(150,158,196)'] : ['rgb(196,198,242)', 'rgb(255,255,255)', 'rgb(255,250,228)'];
    for (let k = 0; k < 6; k++) { const cx = 70 + k * 74, r = 60 + (k % 3) * 18; c(cx, 150 - r * 0.5 + 18, r, cols[0]); }
    for (let k = 0; k < 6; k++) { const cx = 70 + k * 74, r = 58 + (k % 3) * 18; c(cx, 150 - r * 0.5, r, cols[1]); }
    for (let k = 1; k < 6; k += 2) { const cx = 66 + k * 74, r = 24; c(cx, 150 - 58 - 20, r, cols[2]); }
    const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, transparent: true, fog: false, depthWrite: false, toneMapped: false }));
    sp.position.set(x, y, z); sp.scale.set(w, w * 0.45, 1); sc.add(sp);
  }
}
const parts = await (await fetch(`data/${scene}.json`)).json();
addParts(parts);
if (q.get('player')) avatar(...v3(q.get('player')));
document.getElementById('title').textContent = q.get('title') || '';

if (q.get('hud')) {
  const hud = document.getElementById('hud');
  const add = (html) => hud.insertAdjacentHTML('beforeend', html);
  const cur = [['🪙','#ffc428','#6e5410','1.250',14],['💎','#28d2b4','#0f5a4d','40',190],['✦','#a06eff','#43246e','0',366]];
  for (const [ic, c, dk, v, x] of cur) {
    add(`<div class="pill stroke" style="left:${x+16}px;top:16px;width:134px;background:linear-gradient(${dk},#1e1440)">${v}</div>`);
    add(`<div class="ico" style="left:${x}px;top:12px;background:radial-gradient(circle at 35% 30%,#fff8,${c})">${ic}</div>`);
  }
  add(`<div class="btn stroke" style="left:${W/2-135}px;top:10px;width:270px;height:44px;border-color:#164a1c;background:linear-gradient(#8ef08a,#3aa846);font-size:22px;flex-direction:row">🍀&nbsp;Sorte x1.12</div>`);
  const menu = [['🐾','Pets','#ff9628'],['🎒','Itens','#3c96ff'],['🍀','Sorte','#50d25a'],['📖','Bestiário','#aa5aff'],['📜','Missões','#ffc828'],['🗺','Mapa','#28c8c8'],['⚙','Opções','#787896']];
  menu.forEach(([e, n, c], i) => { const x = 12 + (i % 2) * 82, y = H/2 - 150 + Math.floor(i / 2) * 82;
    add(`<div class="btn stroke" style="left:${x}px;top:${y}px;width:74px;height:74px;border-color:#1a1030;background:linear-gradient(${c}dd,${c})"><div style="font-size:30px">${e}</div><div style="font-size:14px">${n}</div></div>`); });
  add(`<div class="card" style="right:14px;top:70px;width:290px;height:132px"></div>`);
  add(`<div class="btn stroke" style="right:164px;top:58px;width:130px;height:26px;border-color:#6e5410;background:linear-gradient(#ffe070,#f0b820);font-size:15px">📜 MISSÃO</div>`);
  add(`<div class="stroke" style="position:absolute;right:30px;top:90px;width:260px;font-size:20px;color:#ffd84a">Colheita</div>`);
  add(`<div style="position:absolute;right:30px;top:116px;width:260px;font:bold 13px Arial;color:#d0ccf0">Quebre 15 arbustos com seus pets.</div>`);
  add(`<div class="bar" style="right:28px;top:152px;width:262px;height:18px"><div style="width:40%;background:linear-gradient(#ffe88a,#f0b820)"></div></div>`);
  const team = [['Bloomfox','#b062ff','✚ Cura','#50d25a'],['Leafwing Finch','#6ed678','◈ Faro do Tesouro','#ffc828'],['Grovekin','#ffba30','✣ Laço de Raízes','#6ec846'],['Mossling','#bec4cc','⛨ Escudo','#3c96ff']];
  team.forEach(([n, rc, ab, ac], i) => { const x = W/2 - 340 + i * 170, y = H - 120;
    add(`<div class="card" style="left:${x}px;top:${y}px;width:160px;height:108px;border-color:${rc}"></div>`);
    add(`<div class="stroke" style="position:absolute;left:${x+10}px;top:${y+6}px;font-size:15px">${n}</div>`);
    add(`<div class="bar" style="left:${x+10}px;top:${y+29}px;width:140px"><div style="width:${[100,82,100,64][i]}%;background:linear-gradient(#a8f0a0,#4cc85a)"></div></div>`);
    add(`<div class="bar" style="left:${x+10}px;top:${y+46}px;width:140px;height:7px"><div style="width:${[70,100,40,90][i]}%;background:#5aaaff"></div></div>`);
    add(`<div class="btn stroke" style="left:${x+10}px;top:${y+57}px;width:136px;height:42px;border-color:#1a1030;background:linear-gradient(${ac}cc,${ac});font-size:14px">${ab}</div>`); });
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(sc, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), q.get('sky') ? 0.12 : 0.35, 0.5, 0.95)); // o céu 2D do jogo não brilha (LightInfluence 0)
composer.addPass(new OutputPass());
composer.render();
window.READY = true;
</script>
